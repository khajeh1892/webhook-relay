services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/relay
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-me
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/relay
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-me
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
